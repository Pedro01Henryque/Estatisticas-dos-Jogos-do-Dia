<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PH Score — Scouting & Estatísticas dos Jogos</title>
  <style>
    :root {
      --bg-canvas: #090d16;
      --bg-surface: #0f172a;
      --bg-elevated: #162033;
      --bg-card-soft: rgba(30, 41, 59, 0.55);
      --border-subtle: rgba(148, 163, 184, 0.14);
      --border-strong: rgba(148, 163, 184, 0.26);

      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;

      --accent-emerald: #10b981;
      --accent-emerald-soft: rgba(16, 185, 129, 0.15);
      --accent-amber: #f59e0b;
      --accent-amber-soft: rgba(245, 158, 11, 0.16);
      --accent-cyan: #38bdf8;
      --accent-cyan-soft: rgba(56, 189, 248, 0.14);
      --accent-rose: #f43f5e;
      --accent-rose-soft: rgba(244, 63, 94, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(circle at 12% 0%, rgba(16, 185, 129, 0.08), transparent 40%),
        radial-gradient(circle at 88% 8%, rgba(56, 189, 248, 0.08), transparent 42%),
        var(--bg-canvas);
      color: var(--text-primary);
      line-height: 1.45;
      min-height: 100vh;
      padding-bottom: 56px;
    }

    .tabular {
      font-variant-numeric: tabular-nums;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(9, 13, 22, 0.88);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 14px 20px;
    }

    .topbar-inner {
      max-width: 1440px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-badge {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      background: linear-gradient(135deg, #10b981 0%, #059669 55%, #0284c7 100%);
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 0.92rem;
      letter-spacing: -0.03em;
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.25);
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-tag {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--accent-cyan-soft);
      color: var(--accent-cyan);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .brand-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .topbar-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .btn {
      border: 1px solid var(--border-strong);
      background: var(--bg-elevated);
      color: var(--text-primary);
      padding: 8px 13px;
      border-radius: 9px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.16s ease;
    }

    .btn:hover {
      background: #1e2d47;
      border-color: rgba(148, 163, 184, 0.42);
    }

    .btn.active {
      background: var(--accent-emerald-soft);
      border-color: rgba(16, 185, 129, 0.55);
      color: #6ee7b7;
    }

    .btn-primary {
      background: linear-gradient(135deg, #10b981, #059669);
      border-color: transparent;
      color: #ffffff;
    }

    .btn-primary:hover {
      filter: brightness(1.08);
    }

    .filters-bar {
      max-width: 1440px;
      margin: 16px auto 0;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .filter-group-label {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-right: 4px;
      align-self: center;
    }

    .pills-row {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: thin;
    }

    .pill {
      white-space: nowrap;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 600;
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .pill:hover {
      border-color: var(--border-strong);
      color: var(--text-primary);
    }

    .pill.active {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.22), rgba(56, 189, 248, 0.18));
      border-color: var(--accent-emerald);
      color: #ffffff;
    }

    .pill.date-pill.active {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.24), rgba(16, 185, 129, 0.16));
      border-color: var(--accent-cyan);
      color: #e0f2fe;
    }

    .match-tabs {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(225px, 1fr));
      gap: 8px;
    }

    .match-tab {
      text-align: left;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.16s ease;
    }

    .match-tab:hover {
      border-color: var(--border-strong);
      background: var(--bg-elevated);
    }

    .match-tab.active {
      background: linear-gradient(145deg, rgba(16, 185, 129, 0.16), var(--bg-elevated));
      border-color: var(--accent-emerald);
      color: var(--text-primary);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28);
    }

    .match-tab-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.68rem;
      color: var(--text-muted);
      margin-bottom: 3px;
    }

    .match-tab-league {
      color: var(--accent-cyan);
      font-weight: 700;
    }

    .match-tab-teams {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .dashboard {
      max-width: 1440px;
      margin: 18px auto 0;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.24);
    }

    .match-header {
      display: grid;
      grid-template-columns: 1.35fr 0.95fr 1fr;
      gap: 18px;
      padding: 20px 22px;
      background: linear-gradient(120deg, rgba(16, 185, 129, 0.08), rgba(15, 23, 42, 0.95) 45%, rgba(56, 189, 248, 0.08));
      border-bottom: 1px solid var(--border-subtle);
    }

    .meta-line {
      font-size: 0.73rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent-emerald);
      margin-bottom: 10px;
    }

    .teams-clash {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .team-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 11px;
      background: var(--bg-card-soft);
      border: 1px solid var(--border-subtle);
    }

    .team-crest {
      width: 38px;
      height: 38px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 0.8rem;
      flex-shrink: 0;
    }

    .team-name {
      font-size: 0.92rem;
      font-weight: 800;
    }

    .form-dots {
      display: flex;
      gap: 4px;
      margin-top: 4px;
    }

    .form-dot {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      font-size: 0.66rem;
      font-weight: 800;
      display: grid;
      place-items: center;
    }

    .form-V { background: var(--accent-emerald-soft); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
    .form-E { background: var(--accent-amber-soft); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); }
    .form-D { background: var(--accent-rose-soft); color: #fb7185; border: 1px solid rgba(244, 63, 94, 0.4); }

    .vs-label {
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--text-muted);
    }

    .info-box {
      padding: 12px 14px;
      border-radius: 11px;
      background: var(--bg-card-soft);
      border: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
    }

    .info-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      font-weight: 700;
    }

    .info-main {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .info-sub {
      font-size: 0.76rem;
      color: var(--text-secondary);
    }

    .ref-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }

    .ref-pill {
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
    }

    .section-head {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .section-title {
      font-size: 0.94rem;
      font-weight: 800;
    }

    .section-sub {
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    .team-stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .team-stats-col:first-child {
      border-right: 1px solid var(--border-subtle);
    }

    .team-col-header {
      padding: 10px 18px;
      background: rgba(15, 23, 42, 0.7);
      border-bottom: 1px solid var(--border-subtle);
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--accent-cyan);
    }

    .metric-row {
      display: grid;
      grid-template-columns: 1.35fr 1.25fr 0.65fr;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.08);
      font-size: 0.78rem;
    }

    .metric-row:last-child {
      border-bottom: none;
    }

    .metric-row.advantage {
      background: rgba(16, 185, 129, 0.07);
    }

    .metric-name {
      color: var(--text-secondary);
      font-weight: 500;
    }

    .metric-seq {
      font-size: 0.73rem;
      color: var(--text-muted);
    }

    .metric-avg {
      text-align: right;
      font-weight: 800;
      color: var(--text-primary);
    }

    .metric-row.advantage .metric-avg {
      color: #34d399;
    }

    .matrix-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .search-input {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      padding: 7px 11px;
      border-radius: 8px;
      font-size: 0.78rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent-cyan);
    }

    .matrix-wrapper {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .matrix-col:first-child {
      border-right: 1px solid var(--border-subtle);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.74rem;
    }

    th, td {
      padding: 7px 8px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.08);
      text-align: center;
    }

    th {
      background: rgba(15, 23, 42, 0.85);
      color: var(--text-muted);
      font-weight: 700;
      cursor: pointer;
      user-select: none;
    }

    th:hover {
      color: var(--text-primary);
    }

    td.player-cell, th.player-col {
      text-align: left;
      padding-left: 14px;
    }

    .pos-tag {
      display: inline-block;
      font-size: 0.64rem;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 4px;
      background: var(--bg-elevated);
      color: var(--accent-cyan);
      margin-left: 5px;
    }

    .role-res {
      font-size: 0.64rem;
      color: var(--accent-amber);
      margin-left: 4px;
    }

    .stat-hot {
      color: #34d399;
      font-weight: 800;
    }

    .insights-card {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.09), rgba(15, 23, 42, 0.96) 50%, rgba(56, 189, 248, 0.09));
      border: 1px solid rgba(16, 185, 129, 0.28);
      border-radius: 14px;
      padding: 20px 22px;
    }

    .insights-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 14px;
    }

    .insights-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
    }

    .insight-item {
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid var(--border-subtle);
      border-radius: 11px;
      padding: 13px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .insight-rank {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: var(--accent-emerald-soft);
      color: #34d399;
      font-size: 0.74rem;
      font-weight: 800;
      margin-right: 6px;
    }

    .insight-title {
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--text-primary);
      display: flex;
      align-items: center;
    }

    .insight-match {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent-cyan);
    }

    .insight-desc {
      font-size: 0.76rem;
      color: var(--text-secondary);
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 60;
      background: #065f46;
      color: #ecfdf5;
      border: 1px solid #10b981;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 700;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.2s ease;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 1040px) {
      .match-header,
      .team-stats-grid,
      .matrix-wrapper {
        grid-template-columns: 1fr;
      }
      .team-stats-col:first-child,
      .matrix-col:first-child {
        border-right: none;
        border-bottom: 1px solid var(--border-subtle);
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-badge">PH</div>
        <div>
          <div class="brand-title">
            PH Score
            <span class="brand-tag">Scouting &amp; Stats</span>
          </div>
          <div class="brand-sub" id="periodoHeader">PH Score • Big 5 + UEFA</div>
        </div>
      </div>

      <div class="topbar-controls">
        <button class="btn" id="btnOnlyAdvantages" type="button">⚡ Só Vantagens</button>
        <button class="btn btn-primary" id="btnCopySummary" type="button">📋 Copiar Resumo</button>
      </div>
    </div>
  </header>

  <div class="filters-bar">
    <div class="pills-row" id="leaguePills"></div>
    <div class="pills-row" id="datePills"></div>
    <div class="match-tabs" id="matchTabs"></div>
  </div>

  <main class="dashboard" id="dashboard"></main>

  <section class="dashboard">
    <div class="insights-card" id="top5InsightsSection"></div>
  </section>

  <div class="toast" id="toast">Resumo copiado para a área de transferência!</div>

  <script>
    const MATCHES_DATA = /* __INJECT_MATCHES_DATA__ */;

    const METRIC_DEFS = [
      { key: 0, name: "Gols Marcados", mode: "max" },
      { key: 1, name: "Gols Sofridos", mode: "min" },
      { key: 2, name: "Finalizações", mode: "max" },
      { key: 3, name: "Finalizações Fora", mode: "max" },
      { key: 4, name: "Finalizações Sofridas", mode: "min" },
      { key: 5, name: "Chutes no Gol", mode: "max" },
      { key: 6, name: "Chutes no Gol Sofridos", mode: "min" },
      { key: 7, name: "Escanteios a Favor", mode: "max" },
      { key: 8, name: "Escanteios 1º Tempo", mode: "max" },
      { key: 9, name: "Escanteios Contra", mode: "min" },
      { key: 10, name: "Escanteios Contra 1º T", mode: "min" },
      { key: 11, name: "Faltas Cometidas", mode: "max" },
      { key: 12, name: "Faltas Sofridas", mode: "max" },
      { key: 13, name: "Cartões Amarelos", mode: "max" },
      { key: 14, name: "Impedimentos", mode: "max" },
      { key: 15, name: "Defesas do Goleiro", mode: "max" },
      { key: 16, name: "Passes Certos", mode: "max" },
      { key: 17, name: "Chances Criadas", mode: "max" }
    ];

    const LEAGUES = [
      "Todas",
      "Premier League",
      "La Liga",
      "Serie A",
      "Bundesliga",
      "Ligue 1",
      "UEFA Champions League",
      "UEFA Europa League",
      "UEFA Conference League"
    ];

    let selectedLeague = "Todas";
    let selectedDate = "Todas";
    let selectedMatchId = MATCHES_DATA[0]?.id || null;
    let onlyAdvantages = false;
    let playerSearch = "";
    let sortMetric = "finAvg";
    let sortAsc = false;

    const avg = (arr) => {
      if (!Array.isArray(arr) || !arr.length) return 0;
      return arr.reduce((a, b) => a + Number(b || 0), 0) / arr.length;
    };

    const showToast = (msg) => {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 2400);
    };

    function extractMatchDate(m) {
      if (m.matchDate) return m.matchDate;
      const match = (m.roundDate || "").match(/(\d{2}\/\d{2}\/\d{4})/);
      return match ? match[1] : "Data a definir";
    }

    function getFilteredMatches() {
      return MATCHES_DATA.filter((m) => {
        const okLeague = selectedLeague === "Todas" || m.leagueKey === selectedLeague;
        const okDate = selectedDate === "Todas" || extractMatchDate(m) === selectedDate;
        return okLeague && okDate;
      });
    }

    function renderLeaguePills() {
      const container = document.getElementById("leaguePills");
      const pills = LEAGUES.map((lg) => {
        const count = lg === "Todas"
          ? MATCHES_DATA.length
          : MATCHES_DATA.filter((m) => m.leagueKey === lg).length;
        return `
          <button class="pill ${selectedLeague === lg ? "active" : ""}" data-league="${lg}" type="button">
            ${lg} (${count})
          </button>
        `;
      }).join("");

      container.innerHTML = `<span class="filter-group-label">Liga:</span>${pills}`;

      container.querySelectorAll(".pill").forEach((btn) => {
        btn.addEventListener("click", () => {
          selectedLeague = btn.dataset.league;
          const list = getFilteredMatches();
          if (!list.some((m) => m.id === selectedMatchId)) {
            selectedMatchId = list[0]?.id || null;
          }
          renderAll();
        });
      });
    }

    function renderDatePills() {
      const container = document.getElementById("datePills");
      const datesSet = new Set();
      MATCHES_DATA.forEach((m) => {
        const d = extractMatchDate(m);
        if (d) datesSet.add(d);
      });

      const dates = ["Todas", ...Array.from(datesSet)];
      const pills = dates.map((dt) => {
        const count = dt === "Todas"
          ? MATCHES_DATA.length
          : MATCHES_DATA.filter((m) => extractMatchDate(m) === dt).length;
        return `
          <button class="pill date-pill ${selectedDate === dt ? "active" : ""}" data-date="${dt}" type="button">
            ${dt === "Todas" ? `Todas as Datas (${count})` : `📅 ${dt} (${count})`}
          </button>
        `;
      }).join("");

      container.innerHTML = `<span class="filter-group-label">Data:</span>${pills}`;

      container.querySelectorAll(".date-pill").forEach((btn) => {
        btn.addEventListener("click", () => {
          selectedDate = btn.dataset.date;
          const list = getFilteredMatches();
          if (!list.some((m) => m.id === selectedMatchId)) {
            selectedMatchId = list[0]?.id || null;
          }
          renderMatchTabs();
          renderDashboard();
          renderDatePills();
        });
      });
    }

    function renderMatchTabs() {
      const container = document.getElementById("matchTabs");
      const list = getFilteredMatches();
      if (!list.length) {
        container.innerHTML = `<div class="section-sub">Nenhum confronto encontrado para este filtro de liga/data.</div>`;
        return;
      }

      container.innerHTML = list.map((m) => `
        <button class="match-tab ${m.id === selectedMatchId ? "active" : ""}" data-id="${m.id}" type="button">
          <div class="match-tab-top">
            <span class="match-tab-league">${m.leagueKey}</span>
            <span class="tabular">${m.subLabel}</span>
          </div>
          <div class="match-tab-teams">${m.tabLabel}</div>
        </button>
      `).join("");

      container.querySelectorAll(".match-tab").forEach((btn) => {
        btn.addEventListener("click", () => {
          selectedMatchId = btn.dataset.id;
          renderDashboard();
          renderMatchTabs();
        });
      });
    }

    function buildMetricCol(team, opp, labelTag) {
      const rows = METRIC_DEFS.map((def, i) => {
        const seq = team.stats?.[i] || [0, 0, 0, 0, 0];
        const oppSeq = opp.stats?.[i] || [0, 0, 0, 0, 0];
        const a = avg(seq);
        const b = avg(oppSeq);
        const hasAdv = def.mode === "max" ? a > b : a < b;
        if (onlyAdvantages && !hasAdv) return "";

        return `
          <div class="metric-row ${hasAdv ? "advantage" : ""}">
            <span class="metric-name">${def.name}</span>
            <span class="metric-seq tabular">[${seq.join(", ")}]</span>
            <span class="metric-avg tabular">${a.toFixed(1)}</span>
          </div>
        `;
      }).join("");

      return `
        <div class="team-stats-col">
          <div class="team-col-header">${team.name} ${labelTag}</div>
          ${rows || `<div class="metric-row"><span class="metric-name">Sem vantagem neste filtro.</span></div>`}
        </div>
      `;
    }

    function enrichPlayers(players = []) {
      const q = playerSearch.trim().toLowerCase();
      return players
        .filter((p) => {
          if (!q) return true;
          return (
            (p.name || "").toLowerCase().includes(q) ||
            (p.pos || "").toLowerCase().includes(q) ||
            (p.role || "").toLowerCase().includes(q)
          );
        })
        .map((p) => ({
          ...p,
          finAvg: avg(p.fin),
          sotAvg: avg(p.sot),
          tacAvg: avg(p.tac),
          fcAvg: avg(p.fc),
          fsAvg: avg(p.fs)
        }))
        .sort((a, b) => {
          const valA = a[sortMetric] ?? 0;
          const valB = b[sortMetric] ?? 0;
          return sortAsc ? valA - valB : valB - valA;
        });
    }

    function buildPlayerTable(teamName, players) {
      const list = enrichPlayers(players);
      const headers = [
        { key: "name", label: "Jogador", cls: "player-col" },
        { key: "finAvg", label: "FIN" },
        { key: "sotAvg", label: "SOT" },
        { key: "tacAvg", label: "DES" },
        { key: "fcAvg", label: "FC" },
        { key: "fsAvg", label: "FS" }
      ];

      return `
        <div class="matrix-col">
          <div class="team-col-header">Elenco • ${teamName} (${list.length})</div>
          <div style="overflow-x:auto;">
            <table>
              <thead>
                <tr>
                  ${headers.map((h) => `
                    <th class="${h.cls || ""}" data-sort="${h.key}">
                      ${h.label} ${sortMetric === h.key ? (sortAsc ? "↑" : "↓") : ""}
                    </th>
                  `).join("")}
                </tr>
              </thead>
              <tbody>
                ${list.map((p) => `
                  <tr>
                    <td class="player-cell">
                      <strong>${p.name}</strong>
                      <span class="pos-tag">${p.pos}</span>
                      ${p.role === "Reserva" ? `<span class="role-res">RES</span>` : ""}
                    </td>
                    <td class="tabular ${p.finAvg >= 2.2 ? "stat-hot" : ""}">${p.finAvg.toFixed(1)}</td>
                    <td class="tabular ${p.sotAvg >= 1.1 ? "stat-hot" : ""}">${p.sotAvg.toFixed(1)}</td>
                    <td class="tabular ${p.tacAvg >= 2.2 ? "stat-hot" : ""}">${p.tacAvg.toFixed(1)}</td>
                    <td class="tabular">${p.fcAvg.toFixed(1)}</td>
                    <td class="tabular">${p.fsAvg.toFixed(1)}</td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderDashboard() {
      const dash = document.getElementById("dashboard");
      const m = MATCHES_DATA.find((item) => item.id === selectedMatchId) || getFilteredMatches()[0];

      if (!m) {
        dash.innerHTML = `<div class="card" style="padding:24px;">Nenhum jogo disponível para exibir neste filtro.</div>`;
        return;
      }

      dash.innerHTML = `
        <article class="card">
          <div class="match-header">
            <div>
              <div class="meta-line">${m.league} • ${m.roundDate}</div>
              <div class="teams-clash">
                <div class="team-chip">
                  <div class="team-crest" style="background:${m.home.bg};color:${m.home.color};">${m.home.abbr}</div>
                  <div>
                    <div class="team-name">${m.home.name}</div>
                    <div class="form-dots">
                      ${(m.home.form || []).map((r) => `<span class="form-dot form-${r}">${r}</span>`).join("")}
                    </div>
                  </div>
                </div>

                <span class="vs-label">VS</span>

                <div class="team-chip">
                  <div class="team-crest" style="background:${m.away.bg};color:${m.away.color};">${m.away.abbr}</div>
                  <div>
                    <div class="team-name">${m.away.name}</div>
                    <div class="form-dots">
                      ${(m.away.form || []).map((r) => `<span class="form-dot form-${r}">${r}</span>`).join("")}
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="info-box">
              <div class="info-label">Local do Confronto</div>
              <div class="info-main">${m.stadium}</div>
              <div class="info-sub">${m.city}</div>
            </div>

            <div class="info-box">
              <div class="info-label">Arbitragem</div>
              <div class="info-main">${m.referee?.name || "A definir"}</div>
              <div class="info-sub">${m.referee?.matches || ""}</div>
              <div class="ref-pills tabular">
                <span class="ref-pill">${m.referee?.yellow || ""}</span>
                <span class="ref-pill">${m.referee?.red || ""}</span>
                <span class="ref-pill">${m.referee?.pen || ""}</span>
              </div>
            </div>
          </div>

          <div class="section-head">
            <div>
              <div class="section-title">Comparativo das 18 Métricas • Últimos 5 Jogos</div>
              <div class="section-sub">Sequência cronológica em 90' e média por partida (todas as competições)</div>
            </div>
          </div>

          <div class="team-stats-grid">
            ${buildMetricCol(m.home, m.away, "(GERAL • TODAS AS COMP.)")}
            ${buildMetricCol(m.away, m.home, "(GERAL • TODAS AS COMP.)")}
          </div>
        </article>

        <article class="card">
          <div class="section-head">
            <div>
              <div class="section-title">Matriz Individual de Scouting</div>
              <div class="section-sub">FIN: Finalizações | SOT: Chutes no Gol | DES: Desarmes | FC: Faltas Cometidas | FS: Faltas Sofridas</div>
            </div>
            <div class="matrix-toolbar">
              <input
                type="text"
                class="search-input"
                id="playerSearchInput"
                placeholder="Buscar jogador, posição ou status..."
                value="${playerSearch}"
              />
            </div>
          </div>

          <div class="matrix-wrapper">
            ${buildPlayerTable(m.home.name, m.home.players)}
            ${buildPlayerTable(m.away.name, m.away.players)}
          </div>
        </article>
      `;

      const searchEl = document.getElementById("playerSearchInput");
      if (searchEl) {
        searchEl.addEventListener("input", (e) => {
          playerSearch = e.target.value;
          renderDashboard();
        });
      }

      dash.querySelectorAll("th[data-sort]").forEach((th) => {
        th.addEventListener("click", () => {
          const key = th.dataset.sort;
          if (sortMetric === key) {
            sortAsc = !sortAsc;
          } else {
            sortMetric = key;
            sortAsc = key === "name";
          }
          renderDashboard();
        });
      });
    }

    function buildTop5Insights() {
      const insights = [];

      MATCHES_DATA.forEach((m) => {
        const hGols = avg(m.home.stats?.[0]);
        const aGols = avg(m.away.stats?.[0]);
        const hSofr = avg(m.home.stats?.[1]);
        const aSofr = avg(m.away.stats?.[1]);
        const projGols = ((hGols + aSofr + aGols + hSofr) / 2);

        insights.push({
          score: projGols,
          title: `Projeção Alta de Gols (${projGols.toFixed(2)}/jogo)`,
          match: `${m.home.name} x ${m.away.name} • ${m.leagueKey}`,
          desc: `${m.home.name} marca ${hGols.toFixed(1)} e sofre ${hSofr.toFixed(1)}, enquanto ${m.away.name} marca ${aGols.toFixed(1)} e sofre ${aSofr.toFixed(1)} nos últimos 5 jogos.`
        });

        const hFin = avg(m.home.stats?.[2]);
        const aFin = avg(m.away.stats?.[2]);
        const topFinTeam = hFin >= aFin ? m.home.name : m.away.name;
        const topFinVal = Math.max(hFin, aFin);

        insights.push({
          score: topFinVal * 0.22,
          title: `Volume Ofensivo: ${topFinTeam} (${topFinVal.toFixed(1)} fin.)`,
          match: `${m.home.name} x ${m.away.name} • ${m.leagueKey}`,
          desc: `Alta frequência de finalizações nos últimos 5 jogos, favorecendo mercados de chutes e pressão ofensiva.`
        });

        const allPlayers = [
          ...(m.home.players || []).map((p) => ({ ...p, team: m.home.name })),
          ...(m.away.players || []).map((p) => ({ ...p, team: m.away.name }))
        ];
        const topScorer = allPlayers.sort((x, y) => avg(y.fin) - avg(x.fin))[0];
        if (topScorer) {
          const finA = avg(topScorer.fin);
          insights.push({
            score: finA * 0.9,
            title: `Destaque Individual: ${topScorer.name} (${finA.toFixed(1)} FIN)`,
            match: `${topScorer.team} (${topScorer.pos}) • ${m.leagueKey}`,
            desc: `Lidera o volume de finalizações recentes no confronto com sequência [${(topScorer.fin || []).join(", ")}].`
          });
        }
      });

      const top5 = insights
        .sort((a, b) => b.score - a.score)
        .slice(0, 5);

      const section = document.getElementById("top5InsightsSection");
      if (!top5.length) {
        section.innerHTML = "";
        return;
      }

      section.innerHTML = `
        <div class="insights-header">
          <div>
            <div class="section-title">🔥 Top 5 Insights dos Jogos</div>
            <div class="section-sub">Destaques estatísticos calculados automaticamente a partir da grade carregada no PH Score</div>
          </div>
        </div>
        <div class="insights-grid">
          ${top5.map((item, idx) => `
            <div class="insight-item">
              <div class="insight-title">
                <span class="insight-rank">#${idx + 1}</span>
                <span>${item.title}</span>
              </div>
              <div class="insight-match">${item.match}</div>
              <div class="insight-desc">${item.desc}</div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function copyMatchSummary() {
      const m = MATCHES_DATA.find((item) => item.id === selectedMatchId) || getFilteredMatches()[0];
      if (!m) return;

      const hGols = avg(m.home.stats?.[0]).toFixed(1);
      const aGols = avg(m.away.stats?.[0]).toFixed(1);
      const hFin = avg(m.home.stats?.[2]).toFixed(1);
      const aFin = avg(m.away.stats?.[2]).toFixed(1);

      const txt = [
        `📊 PH SCORE — ${m.home.name} x ${m.away.name}`,
        `🏆 ${m.league} | ${m.roundDate}`,
        `🧑‍⚖️ Árbitro: ${m.referee?.name || "A definir"}`,
        `⚽ Gols (últ. 5): ${m.home.name} ${hGols} x ${aGols} ${m.away.name}`,
        `🎯 Finalizações (últ. 5): ${m.home.name} ${hFin} x ${aFin} ${m.away.name}`
      ].join("\n");

      navigator.clipboard?.writeText(txt);
      showToast("Resumo do confronto copiado!");
    }

    function renderAll() {
      renderLeaguePills();
      renderDatePills();
      renderMatchTabs();
      renderDashboard();
      buildTop5Insights();
    }

    document.getElementById("btnOnlyAdvantages").addEventListener("click", (e) => {
      onlyAdvantages = !onlyAdvantages;
      e.currentTarget.classList.toggle("active", onlyAdvantages);
      renderDashboard();
    });

    document.getElementById("btnCopySummary").addEventListener("click", copyMatchSummary);

    renderAll();
  </script>
</body>
</html>
