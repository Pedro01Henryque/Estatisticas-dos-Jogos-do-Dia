<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arena dos Dados — Jogos da Semana (Big 5 + UEFA)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #060911;
      --bg-surface: #0c1220;
      --bg-elevated: #121b2f;
      --bg-row-alt: rgba(255, 255, 255, 0.022);
      --border-subtle: rgba(148, 163, 184, 0.12);
      --border-strong: rgba(148, 163, 184, 0.24);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;

      --emerald: #10b981;
      --emerald-glow: rgba(16, 185, 129, 0.16);
      --cyan: #06b6d4;
      --cyan-glow: rgba(6, 182, 212, 0.15);
      --amber: #f59e0b;
      --amber-glow: rgba(245, 158, 11, 0.16);
      --rose: #f43f5e;
      --blue: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-base);
      background-image:
        radial-gradient(circle at 12% 0%, rgba(16, 185, 129, 0.09), transparent 38%),
        radial-gradient(circle at 88% 5%, rgba(6, 182, 212, 0.08), transparent 38%);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 18px;
      line-height: 1.45;
      min-height: 100vh;
    }

    .container {
      max-width: 1360px;
      margin: 0 auto;
    }

    /* TOP NAVIGATION & LEAGUE FILTERS */
    .top-bar {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: rgba(12, 18, 32, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 14px 18px;
      margin-bottom: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    .top-row-main {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 900;
      font-size: 1.08rem;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #34d399, #22d3ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-sub {
      font-size: 0.74rem;
      color: var(--text-secondary);
      font-weight: 600;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      padding: 3px 9px;
      border-radius: 999px;
      -webkit-text-fill-color: var(--text-secondary);
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 12px var(--emerald);
      flex-shrink: 0;
    }

    .league-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding-top: 10px;
      border-top: 1px solid var(--border-subtle);
    }

    .league-btn {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.76rem;
      font-weight: 700;
      transition: all 0.16s ease;
    }

    .league-btn:hover {
      border-color: var(--cyan);
      color: var(--text-primary);
    }

    .league-btn.active {
      background: var(--cyan-glow);
      border-color: var(--cyan);
      color: #22d3ee;
    }

    .match-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 10px;
      border-top: 1px solid var(--border-subtle);
    }

    .match-tab {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.81rem;
      font-weight: 600;
      transition: all 0.18s ease;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
    }

    .match-tab:hover {
      border-color: var(--emerald);
      color: var(--text-primary);
      transform: translateY(-1px);
    }

    .match-tab.active {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #03150e;
      border-color: #34d399;
      font-weight: 800;
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.35);
    }

    .match-tab small {
      font-size: 0.67rem;
      opacity: 0.82;
      font-weight: 600;
    }

    .actions-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      padding: 8px 13px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: all 0.18s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      border-color: var(--border-strong);
      background: #18233c;
    }

    .btn.active-filter {
      background: var(--amber-glow);
      border-color: var(--amber);
      color: #fbbf24;
    }

    .btn-primary {
      background: linear-gradient(135deg, #0ea5e9, #2563eb);
      border-color: #38bdf8;
      color: #ffffff;
      font-weight: 700;
    }

    .btn-primary:hover {
      filter: brightness(1.1);
    }

    /* DASHBOARD WRAPPER */
    .dashboard {
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65);
    }

    /* HERO HEADER DO CONFRONTO */
    .match-header {
      display: grid;
      grid-template-columns: 1.25fr 1fr 1.2fr;
      gap: 20px;
      padding: 24px 28px;
      background:
        linear-gradient(135deg, rgba(16, 185, 129, 0.08) 0%, transparent 45%),
        linear-gradient(225deg, rgba(6, 182, 212, 0.08) 0%, transparent 45%),
        #0a0f1c;
      border-bottom: 1px solid var(--border-strong);
      align-items: center;
    }

    .teams-box {
      display: flex;
      align-items: center;
      justify-content: space-around;
      gap: 14px;
    }

    .team-card {
      text-align: center;
      flex: 1;
    }

    .crest {
      width: 68px;
      height: 68px;
      border-radius: 18px;
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.32rem;
      letter-spacing: 1px;
      border: 2px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45);
    }

    .team-name {
      font-weight: 800;
      font-size: 0.96rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-label {
      font-size: 0.69rem;
      color: var(--text-muted);
      margin-top: 3px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-badges {
      display: flex;
      justify-content: center;
      gap: 4px;
      margin-top: 5px;
    }

    .badge-form {
      width: 21px;
      height: 21px;
      border-radius: 6px;
      font-size: 0.71rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .form-V { background: rgba(16, 185, 129, 0.18); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.5); }
    .form-E { background: rgba(245, 158, 11, 0.18); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.5); }
    .form-D { background: rgba(244, 63, 94, 0.18); color: #fb7185; border: 1px solid rgba(244, 63, 94, 0.5); }

    .vs-pill {
      background: var(--bg-elevated);
      border: 1px solid var(--border-strong);
      color: var(--text-secondary);
      font-weight: 900;
      font-size: 0.85rem;
      padding: 6px 11px;
      border-radius: 999px;
    }

    .stadium-box {
      text-align: center;
      border-left: 1px solid var(--border-subtle);
      border-right: 1px solid var(--border-subtle);
      padding: 0 18px;
    }

    .league-pill {
      display: inline-block;
      background: var(--cyan-glow);
      border: 1px solid rgba(6, 182, 212, 0.4);
      color: #22d3ee;
      font-weight: 800;
      font-size: 0.74rem;
      padding: 4px 12px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .match-datetime {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-primary);
      margin: 8px 0 10px;
    }

    .stadium-banner {
      background: rgba(18, 27, 47, 0.85);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 10px 12px;
    }

    .stadium-name {
      font-weight: 700;
      font-size: 0.82rem;
      color: #e2e8f0;
    }

    .stadium-city {
      font-size: 0.74rem;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* ÁRBITRO CARD */
    .referee-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      background: rgba(18, 27, 47, 0.7);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 12px 16px;
    }

    .ref-info h4 {
      font-size: 0.68rem;
      color: var(--cyan);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 800;
    }

    .ref-name {
      font-size: 0.94rem;
      font-weight: 800;
      color: var(--text-primary);
      margin: 2px 0 7px;
    }

    .ref-stat {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .ref-stat strong {
      color: var(--text-primary);
    }

    .card-icon {
      display: inline-block;
      width: 9px;
      height: 13px;
      border-radius: 2px;
    }

    .card-yellow { background: #facc15; box-shadow: 0 0 6px rgba(250, 204, 21, 0.4); }
    .card-red { background: #f43f5e; box-shadow: 0 0 6px rgba(244, 63, 94, 0.4); }
    .card-pen { background: #38bdf8; }

    .ref-avatar {
      width: 60px;
      height: 70px;
      border-radius: 12px;
      background: linear-gradient(160deg, #34d399 0%, #059669 100%);
      color: #03150e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.15rem;
      flex-shrink: 0;
      box-shadow: 0 6px 16px rgba(16, 185, 129, 0.25);
    }

    .ref-avatar span {
      font-size: 0.58rem;
      text-transform: uppercase;
      font-weight: 800;
      margin-top: 2px;
    }

    /* SECTION DIVIDERS */
    .section-divider {
      background: linear-gradient(90deg, #0c1220, #131d33, #0c1220);
      text-align: center;
      padding: 9px 16px;
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 2.2px;
      color: var(--cyan);
      border-bottom: 1px solid var(--border-subtle);
      text-transform: uppercase;
    }

    /* COMPARATIVO DE EQUIPES (18 MÉTRICAS) */
    .team-stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 1px solid var(--border-strong);
    }

    .team-stats-col {
      padding: 16px 20px;
    }

    .team-stats-col:first-child {
      border-right: 1px solid var(--border-subtle);
    }

    .col-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--border-strong);
    }

    .col-header-left strong {
      display: block;
      color: var(--text-primary);
      font-size: 0.82rem;
      letter-spacing: 0.3px;
    }

    .col-header-left span {
      color: var(--text-secondary);
      font-size: 0.73rem;
    }

    .col-header-mid {
      text-align: center;
      font-weight: 800;
      font-size: 0.84rem;
      color: var(--emerald);
    }

    .col-header-mid small {
      display: block;
      font-weight: 500;
      color: var(--text-muted);
      font-size: 0.68rem;
    }

    .col-header-right {
      text-align: right;
      font-weight: 700;
      color: var(--text-secondary);
      font-size: 0.72rem;
    }

    .stat-row {
      display: grid;
      grid-template-columns: 1.45fr 1.2fr 0.45fr;
      align-items: center;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.81rem;
      font-variant-numeric: tabular-nums;
      transition: background 0.15s;
    }

    .stat-row:nth-child(even) {
      background: var(--bg-row-alt);
    }

    .stat-row:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .stat-row.highlight {
      background: var(--emerald-glow);
      border-left: 3px solid var(--emerald);
    }

    .stat-row.highlight .stat-name {
      color: #ecfdf5;
      font-weight: 600;
    }

    .stat-row.highlight .stat-avg {
      color: #34d399;
      font-weight: 800;
    }

    .stat-row.dimmed {
      opacity: 0.24;
    }

    .stat-name {
      color: var(--text-secondary);
    }

    .stat-seq {
      text-align: center;
      letter-spacing: 0.8px;
      color: #cbd5e1;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.77rem;
    }

    .stat-avg {
      text-align: right;
      font-weight: 700;
      color: var(--text-primary);
      font-family: 'JetBrains Mono', monospace;
    }

    /* MATRIZ COMPLETA DE SCOUTING DE JOGADORES */
    .scouting-section {
      padding: 22px 24px 28px;
      background: #080d18;
    }

    .scouting-toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      padding: 12px 16px;
      border-radius: 14px;
    }

    .scouting-title-group h3 {
      font-size: 0.96rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .scouting-title-group p {
      font-size: 0.76rem;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .scouting-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .search-input {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.81rem;
      min-width: 215px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--cyan);
    }

    .matrix-wrapper {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .matrix-wrapper.single-col {
      grid-template-columns: 1fr;
    }

    .team-matrix-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
    }

    .matrix-team-banner {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(90deg, rgba(18, 27, 47, 0.95), rgba(12, 18, 32, 0.95));
      border-bottom: 1px solid var(--border-strong);
    }

    .matrix-team-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 0.88rem;
      text-transform: uppercase;
    }

    .mini-crest {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.68rem;
      font-weight: 900;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .squad-count-badge {
      background: var(--cyan-glow);
      color: #22d3ee;
      border: 1px solid rgba(6, 182, 212, 0.35);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
    }

    .table-scroll {
      overflow-x: auto;
      max-height: 700px;
      overflow-y: auto;
    }

    table.scouting-matrix {
      width: 100%;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
    }

    table.scouting-matrix thead th {
      position: sticky;
      top: 0;
      z-index: 5;
      background: #131c31;
      color: var(--text-secondary);
      font-size: 0.71rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 10px 6px;
      border-bottom: 1px solid var(--border-strong);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      transition: all 0.15s;
    }

    table.scouting-matrix thead th:first-child {
      text-align: left;
      padding-left: 14px;
      cursor: default;
      position: sticky;
      left: 0;
      z-index: 6;
    }

    table.scouting-matrix thead th:hover:not(:first-child) {
      color: var(--amber);
      background: #18233d;
    }

    table.scouting-matrix thead th.sorted-col {
      color: #fbbf24;
      background: rgba(245, 158, 11, 0.16);
    }

    table.scouting-matrix td {
      padding: 8px 6px;
      border-bottom: 1px solid var(--border-subtle);
      text-align: center;
      vertical-align: middle;
    }

    table.scouting-matrix td:first-child {
      position: sticky;
      left: 0;
      background: var(--bg-surface);
      z-index: 2;
      border-right: 1px solid var(--border-subtle);
    }

    table.scouting-matrix tr:nth-child(even) td {
      background: #0b101d;
    }

    table.scouting-matrix tr:hover td {
      background: #141e33;
    }

    .player-cell {
      display: flex;
      align-items: center;
      gap: 9px;
      text-align: left;
      padding-left: 8px;
      min-width: 165px;
    }

    .player-avatar {
      width: 31px;
      height: 31px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.72rem;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.22);
    }

    .player-meta strong {
      display: block;
      font-size: 0.8rem;
      color: var(--text-primary);
      line-height: 1.2;
    }

    .player-meta-sub {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 2px;
    }

    .pos-tag {
      font-size: 0.63rem;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 4px;
      background: rgba(148, 163, 184, 0.14);
      color: var(--text-secondary);
    }

    .role-tag {
      font-size: 0.64rem;
      color: var(--text-muted);
    }

    .metric-cell {
      border-radius: 7px;
      padding: 4px 5px;
    }

    .metric-cell.top-leader {
      background: var(--amber-glow);
      border: 1px solid rgba(245, 158, 11, 0.42);
    }

    .metric-avg {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 0.84rem;
      color: var(--text-primary);
      line-height: 1.1;
    }

    .metric-cell.top-leader .metric-avg {
      color: #fbbf24;
    }

    .metric-seq {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      color: var(--text-muted);
      margin-top: 2px;
      letter-spacing: 0.2px;
    }

    /* MODAL ADICIONAR JOGO */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 15, 0.82);
      backdrop-filter: blur(6px);
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: 16px;
      max-width: 520px;
      width: 100%;
      padding: 22px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
    }

    .modal-box h3 {
      margin-bottom: 14px;
      color: var(--emerald);
      font-size: 1.05rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 11px;
      margin-bottom: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group.full {
      grid-column: span 2;
    }

    .form-group label {
      font-size: 0.75rem;
      color: var(--text-secondary);
      font-weight: 600;
    }

    let activeLeagueKey = "ALL";

    let highlightOnly = false;
    let teamFilter = "all"; // "all" | "home" | "away"
    let sortMetricKey = null;
    let playerSearch = "";

    function calcAvg(arr) {
      if (!arr || !arr.length) return 0;
      const sum = arr.reduce((a, b) => a + b, 0);
      return +(sum / arr.length).toFixed(1);
    }

    function getFilteredMatches() {
      if (activeLeagueKey === "ALL") return MATCHES_DATA;
      return MATCHES_DATA.filter((m) => m.leagueKey === activeLeagueKey);
    }

    function renderLeaguePills() {
      const container = document.getElementById("leaguePills");
      container.innerHTML = LEAGUES_FILTER.map((l) => {
        const count =
          l.key === "ALL"
            ? MATCHES_DATA.length
            : MATCHES_DATA.filter((m) => m.leagueKey === l.key).length;
        return `
          <button class="league-btn ${l.key === activeLeagueKey ? "active" : ""}" onclick="selectLeague('${l.key}')">
            ${l.label} (${count})
          </button>
        `;
      }).join("");
    }

    function selectLeague(key) {
      activeLeagueKey = key;
      const list = getFilteredMatches();
      if (list.length && !list.some((m) => m.id === activeMatchId)) {
        activeMatchId = list[0].id;
      }
      sortMetricKey = null;
      playerSearch = "";
      renderLeaguePills();
      renderTabs();
      renderDashboard();
    }

    function renderTabs() {
      const container = document.getElementById("matchTabs");
      const list = getFilteredMatches();
      container.innerHTML = list
        .map(
          (m) => `
            <button class="match-tab ${m.id === activeMatchId ? "active" : ""}" onclick="selectMatch('${m.id}')">
              <span>${m.tabLabel}</span>
              <small>${m.subLabel} • ${m.leagueKey}</small>
            </button>
          `
        )
        .join("");
    }

    function selectMatch(id) {
      activeMatchId = id;
      sortMetricKey = null;
      playerSearch = "";
      renderTabs();
      renderDashboard();
    }

    function toggleHighlightFilter() {
      highlightOnly = !highlightOnly;
      const btn = document.getElementById("btnHighlightOnly");
      btn.classList.toggle("active-filter", highlightOnly);
      renderDashboard();

    function setTeamFilter(val) {
      teamFilter = val;
      renderDashboard();

    function toggleSortMetric(key) {
      sortMetricKey = sortMetricKey === key ? null : key;
      renderDashboard();

    function handleSearchInput(val) {
      playerSearch = val.toLowerCase();

    function buildTeamStatsColumn(teamObj, opponentObj, venueLabel) {
      const rowsHtml = METRIC_LABELS.map((label, i) => {
        const seq = teamObj.stats[i];
        const oppSeq = opponentObj.stats[i];
        const avg = calcAvg(seq);
        const oppAvg = calcAvg(oppSeq);

        const isBetter = avg > oppAvg;
        const rowClass = isBetter
          ? "stat-row highlight"
          : highlightOnly
          ? "stat-row dimmed"
          : "stat-row";

        return `
          <div class="${rowClass}">
            <div class="stat-name">${label}</div>
            <div class="stat-seq">${seq.join(" - ")}</div>
            <div class="stat-avg">${avg.toFixed(1)}</div>
          </div>
        `;
      }).join("");

      return `
        <div class="team-stats-col">
          <div class="col-header">
            <div class="col-header-left">
              <strong>ESTATÍSTICAS DA EQUIPE</strong>
              <span>Últimos 5 Jogos <b>${venueLabel}</b></span>
            </div>
            <div class="col-header-mid">
              ${teamObj.name}
              <small>Sequência em 90'</small>
            </div>
            <div class="col-header-right">
              MÉDIA<br/>em 90'
            </div>
          </div>
          ${rowsHtml}
        </div>
      `;
    }

    function buildPlayerMatrixCard(teamObj) {
      const allPlayers = teamObj.players;

      const maxByCol = {};
      PLAYER_COLS.forEach((col) => {
        maxByCol[col.key] = Math.max(...allPlayers.map((p) => calcAvg(p[col.key])));
      });

      let filteredPlayers = allPlayers.filter(
        (p) =>
          p.name.toLowerCase().includes(playerSearch) ||
          p.pos.toLowerCase().includes(playerSearch) ||
          (p.role && p.role.toLowerCase().includes(playerSearch))
      );

      if (sortMetricKey) {
        filteredPlayers.sort((a, b) => calcAvg(b[sortMetricKey]) - calcAvg(a[sortMetricKey]));
      }

      const headersHtml = PLAYER_COLS.map((col) => {
        const isSorted = sortMetricKey === col.key;
        return `
          <th class="${isSorted ? "sorted-col" : ""}" onclick="toggleSortMetric('${col.key}')" title="Ordenar por ${col.label}">
            ${col.label} ${isSorted ? "▼" : ""}
          </th>
        `;
      }).join("");

      const rowsHtml = filteredPlayers.length
        ? filteredPlayers
            .map((p) => {
              const initials = p.name
                .split(" ")
                .map((n) => n[0])
                .slice(0, 2)
                .join("");

              const cellsHtml = PLAYER_COLS.map((col) => {
                const arr = p[col.key];
                const avg = calcAvg(arr);
                const isLeader = avg > 0 && avg === maxByCol[col.key];
                return `
                  <td>
                    <div class="metric-cell ${isLeader ? "top-leader" : ""}">
                      <div class="metric-avg">${avg.toFixed(1)}</div>
                      <div class="metric-seq">${arr.join("-")}</div>
                    </div>
                  </td>
                `;
              }).join("");

              return `
                <tr>
                  <td>
                    <div class="player-cell">
                      <div class="player-avatar" style="background:${teamObj.bg}; color:${teamObj.color};">${initials}</div>
                      <div class="player-meta">
                        <strong>${p.name}</strong>
                        <div class="player-meta-sub">
                          <span class="pos-tag">${p.pos}</span>
                          <span class="role-tag">${p.role || "Elenco"}</span>
                        </div>
                      </div>
                    </div>
                  </td>
                  ${cellsHtml}
                </tr>
              `;
            })
            .join("")
        : `<tr><td colspan="6" style="padding:20px; color:var(--text-muted);">Nenhum jogador encontrado para "${playerSearch}".</td></tr>`;

      return `
        <div class="team-matrix-card">
          <div class="matrix-team-banner">
            <div class="matrix-team-title">
              <span class="mini-crest" style="background:${teamObj.bg}; color:${teamObj.color};">${teamObj.abbr}</span>
              ${teamObj.name}
            </div>
            <span class="squad-count-badge">${filteredPlayers.length} jogadores</span>
          </div>
          <div class="table-scroll">
            <table class="scouting-matrix">
              <thead>
                <tr>
                  <th>Jogador</th>
                  ${headersHtml}
                </tr>
              </thead>
              <tbody>
                ${rowsHtml}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function copyTelegramSummary() {
      const m = MATCHES_DATA.find((item) => item.id === activeMatchId) || MATCHES_DATA[0];
      const topHomeFin = [...m.home.players].sort((a, b) => calcAvg(b.fin) - calcAvg(a.fin))[0];
      const topAwayFin = [...m.away.players].sort((a, b) => calcAvg(b.fin) - calcAvg(a.fin))[0];

      const text = [
        `📊 ARENA DOS DADOS — ${m.home.name} x ${m.away.name}`,
        `🏆 ${m.league} | ${m.roundDate}`,
        `🟨 Árbitro: ${m.referee.name} (${m.referee.yellow})`,

        ``,
        `🎯 LÍDERES EM FINALIZAÇÕES:`,
        `• ${topHomeFin.name} (${m.home.abbr}): Média ${calcAvg(topHomeFin.fin)} (${topHomeFin.fin.join("-")})`,
        `• ${topAwayFin.name} (${m.away.abbr}): Média ${calcAvg(topAwayFin.fin)} (${topAwayFin.fin.join("-")})`
      ].join("\n");

      navigator.clipboard.writeText(text).then(() => {

        },
        home: {
          name: homeName.toUpperCase(),
          abbr: homeName.slice(0, 3).toUpperCase(),
          bg: "#059669",
          color: "#ffffff",
          form: ["V", "E", "V", "V", "E"],
          stats: genStats(),
          players: genFullSquad(homeName.slice(0, 3).toUpperCase())
        },
        away: {
          name: awayName.toUpperCase(),
          abbr: awayName.slice(0, 3).toUpperCase(),
          bg: "#0284c7",
          color: "#ffffff",
          form: ["E", "V", "D", "V", "E"],
          stats: genStats(),
          players: genFullSquad(awayName.slice(0, 3).toUpperCase())
        }
      });

      activeLeagueKey = "ALL";
      closeModal();
      renderLeaguePills();
      selectMatch(newId);
    }

    renderLeaguePills();
    renderTabs();
    renderDashboard();
  </script>
</body>
</html>
